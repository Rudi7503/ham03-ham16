<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAM Pro: Modular Edition</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #2c2f33; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Globale App-Toolbar */
        #global-top-bar { background-color: #181a1c; padding: 12px 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; gap: 15px; align-items: center; z-index: 20; border-bottom: 2px solid #007bff; }
        h1 { margin: 0; font-size: 18px; color: #4dabf7; border-right: 2px solid #444; padding-right: 15px; }
        
        .btn-global { background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; transition: background 0.2s; }
        .btn-global:hover { background: #0056b3; }
        .btn-success { background: #28a745; } .btn-success:hover { background: #218838; }
        #btn-test-images { background: #6f42c1; } #btn-test-images:hover { background: #5a32a3; }
        
        /* Modul-Container */
        #app-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #000; }

        /* Testbild-Auswahl */
        #testimg-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 2000; display: none; align-items: center; justify-content: center; }
        #testimg-panel { background: #1e2124; border: 1px solid #555; border-radius: 8px; padding: 20px 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); min-width: 420px; max-width: 92vw; }
        #testimg-panel h3 { margin: 0 0 4px 0; color: #c084fc; }
        #testimg-panel .hint { margin: 0 0 14px 0; font-size: 11px; color: #999; }
        #testimg-panel .step-title { font-size: 12px; font-weight: bold; color: #ccc; margin: 10px 0 6px 0; }
        #testimg-panel .btn-row { display: flex; flex-wrap: wrap; gap: 6px; }
        #testimg-panel .btn-row button { background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; padding: 7px 12px; font-size: 12px; font-weight: bold; cursor: pointer; transition: background 0.15s; }
        #testimg-panel .btn-row button:hover { background: #17a2b8; }
        #testimg-panel .btn-row button.active { background: #17a2b8; border-color: #4dabf7; }
        #testimg-panel .btn-foot { margin-top: 16px; text-align: right; }
        #testimg-panel .btn-foot button { background: #555; color: #fff; border: none; border-radius: 4px; padding: 6px 14px; font-size: 12px; cursor: pointer; }
        #testimg-panel .btn-foot button:hover { background: #6c757d; }
    </style>
</head>
<body>
    <div id="global-top-bar">
        <h1>HAM LAB Pro</h1>
        
        <label for="file-img" class="btn-global" title="Originalbild (PNG/JPG) laden">1. Bild laden</label>
        <input type="file" id="file-img" accept="image/png, image/jpeg, image/bmp, image/webp" style="display: none;">
        
        <label for="file-bin" class="btn-global btn-success" title="Gepacktes HAM-File laden">.ham laden</label>
        <input type="file" id="file-bin" accept=".ham" style="display: none;">
        
        <button id="btn-test-images" class="btn-global" title="Prozedural erzeugte Testbilder (4 Bit/pix HAM)">Testbilder</button>

        <!-- Bild auf Standardauflösungen skalieren -->
        <div style="display: flex; align-items: center; gap: 6px; margin-left: 10px;">
            <label for="scale-preset" style="color: #adb5bd; font-size: 12px;" title="Standardauflösungen in Pixeln. Das Bild wird auf die Zielgröße gestreckt — das Seitenverhältnis bleibt NICHT erhalten.">Größe:</label>
            <select id="scale-preset" title="Vorgabe wählen, sie füllt Breite und Höhe. Danach »Skalieren« drücken.">
                <option value="">– Vorgabe –</option>
                <option value="320x256">320 × 256 · Amiga Lowres</option>
                <option value="640x256">640 × 256 · Amiga Hires</option>
                <option value="640x512">640 × 512 · Amiga Hires Interlace</option>
                <option value="640x480">640 × 480 · VGA</option>
                <option value="800x600">800 × 600 · SVGA</option>
                <option value="320x240">320 × 240 · QVGA</option>
                <option value="320x200">320 × 200 · VGA 13h</option>
                <option value="256x256">256 × 256</option>
                <option value="512x384">512 × 384</option>
                <option value="512x512">512 × 512</option>
                <option value="640x400">640 × 400</option>
                <option value="720x480">720 × 480 · NTSC</option>
                <option value="720x576">720 × 576 · PAL</option>
                <option value="1024x768">1024 × 768 · XGA</option>
                <option value="1280x720">1280 × 720 · 720p</option>
                <option value="1920x1080">1920 × 1080 · 1080p</option>
            </select>
            <input type="number" id="scale-w" min="1" max="8192" placeholder="B" style="width: 62px;" title="Zielbreite in Pixeln (1–8192)">
            <span style="color: #888;">×</span>
            <input type="number" id="scale-h" min="1" max="8192" placeholder="H" style="width: 62px;" title="Zielhöhe in Pixeln (1–8192)">
            <select id="scale-mode" title="Seitenverhältnis: »Strecken« bildet das ganze Bild auf die Zielgröße ab, x und y werden UNABHÄNGIG skaliert (Seitenverhältnis verändert, dafür kein Beschnitt und keine Ränder). »Ausfüllen« skaliert gleichmäßig und schneidet den Überstand ab. »Einpassen« skaliert gleichmäßig und lässt die Ränder schwarz.">
                <option value="fill" selected>Ausfüllen</option>
                <option value="fit">Einpassen</option>
                <option value="stretch">Strecken (x/y unabhängig)</option>
            </select>
            <select id="scale-method" title="Verfahren: Lanczos-3 ist das gemessen beste (Rundreise 256→128→256: PSNR 26,3 dB). Wavelet 9/7 ist ein dyadischer Tiefpass mit Lanczos-Rest und liegt bei 24,4 dB, ist also schlechter und langsamer. Flächenmittel (21,8–25,1 dB) ist nur als Referenz da.">
                <option value="lanczos" selected>Lanczos-3</option>
                <option value="wavelet">Wavelet 9/7</option>
                <option value="box">Flächenmittel</option>
            </select>
            <button id="btn-scale" class="btn-global" disabled title="Skaliert das geladene Bild auf diese Größe (gestreckt) und setzt Palette, Codierung und Fehlerbild zurück. Das Ergebnis ist das neue Original. Verfahren wählbar im Feld davor.">Skalieren</button>
        </div>
        
        <!-- NEU: Modus-Tabs -->
        <div style="margin-left: 30px; display: flex; gap: 5px;">
            <button class="btn-tab active" data-mode="builder" style="background:#17a2b8; color:#fff; border:none; padding:8px 15px; border-radius:4px; cursor:pointer;">Builder</button>
            <button class="btn-tab" data-mode="sprite" style="background:#444; color:#fff; border:none; padding:8px 15px; border-radius:4px; cursor:pointer;">Sprite Studio</button>
            <button class="btn-tab" data-mode="viewer" style="background:#444; color:#fff; border:none; padding:8px 15px; border-radius:4px; cursor:pointer;">Viewer</button>
        </div>
    </div>
    
    <div id="app-container">
        <div style="padding: 20px; color: #aaa; font-size: 14px;">Warte auf Bilddaten... Bitte lade oben ein Bild.</div>
    </div>

    <!-- Testbild-Auswahl -->
    <div id="testimg-overlay">
        <div id="testimg-panel">
            <h3>Testbilder (4 Bit/pix HAM)</h3>
            <p class="hint">Wähle zuerst den Stil, dann die Pixelgröße. Das Bild wird direkt als neues Original geladen.</p>

            <div class="step-title">1. Stil:</div>
            <div class="btn-row" id="testimg-type-row">
                <button data-type="stress" title="Rauschen, Schachbrett, 1-px-Muster">Stress</button>
                <button data-type="sweet" title="Glatte Verläufe + Farbbalken">Sweet</button>
                <button data-type="real" title="Prozedurale Foto-Landschaft (Himmel/Sonne/Wasser)">Real</button>
                <button data-type="pixelstyle" title="Pixel-Art Alien (harte Kanten, wenige Farben)">Pixelstyle</button>
            </div>

            <div class="step-title" id="testimg-size-title" style="display:none;">2. Größe:</div>
            <div class="btn-row" id="testimg-size-row" style="display:none;">
                <button data-size="16">16×16</button>
                <button data-size="32">32×32</button>
                <button data-size="64">64×64</button>
                <button data-size="128">128×128</button>
                <button data-size="256">256×256</button>
                <button data-size="512">512×512</button>
            </div>

            <div class="btn-foot"><button id="testimg-cancel">Abbrechen</button></div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
